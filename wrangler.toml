# 预编译产物已提交在 dist/（shim.mjs + index.wasm）。
# 这里不放 [build] 段：仓库里有的就是能直接跑的东西，部署时不需要编译。
# 改了 Rust 代码要重新出产物，见 README。
name = "dsh-mobile-relay-2"
main = "dist/shim.mjs"
compatibility_date = "2026-10-15"
